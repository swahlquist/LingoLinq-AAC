name: Deploy to Cloud Run

# Multi-environment deploy pipeline for GCP Cloud Run: production, staging, and dev.
#
# ENVIRONMENT MAPPING (the `resolve` job, fail-closed):
#   refs/heads/main     -> GitHub environment `production` -> project from that environment's vars,
#                          UNSUFFIXED resource names (lingolinq-web, lingolinq-worker,
#                          lingolinq-migrate, lingolinq-scheduler). Prod RESOURCE NAMES are
#                          unchanged. Prod BEHAVIOUR changed in exactly three ways, stated for
#                          the approver: (1) five runtime values (buckets, CDN, Sentry env,
#                          REMOTE_EXTRA_DATA) moved from literals in this file to the
#                          `production` environment's APP_* variables, all REQUIRED there
#                          (fail closed when blank); (2) the worker-pool deploy is gated on
#                          DEPLOY_WORKER, which production REQUIRES to be 'true' (fail closed);
#                          (3) `--no-traffic` is skipped only on a genuine NOT_FOUND first deploy,
#                          never on an existing service. Also new for prod: the scheduler Job
#                          (lingolinq-scheduler) is deployed by this workflow on every release
#                          with the same secret set and plain env as web, at its live size
#                          (1 vCPU / 512Mi); it is CREATED if absent, so staging gets one on its
#                          first deploy (harmless until an operator adds a Cloud Scheduler trigger).
#   refs/heads/staging  -> GitHub environment `staging`    -> `-staging` suffix on every resource.
#   refs/heads/develop  -> GitHub environment `dev`        -> `-dev` suffix on every resource.
#   anything else       -> no environment, deploy job SKIPPED with a notice. This covers a
#                          `workflow_dispatch` on a feature branch or a tag: nothing is deployed,
#                          nothing is built, no token is minted.
# Every GCP_* and APP_* value below is read from `vars.*` UNDER `environment: <env_name>`, so
# each environment's variables select its own project, WIF provider, deploy SA, Cloud SQL
# instance, VPC, buckets, Sentry env, and host. The `production` environment keeps its
# required-reviewer rule, so a push to `main` still pauses for approval exactly as before;
# `staging` and `dev` exist in GitHub with no protection rules and deploy unattended.
#
# STAGING AND DEV SHARE ONE PROJECT (lingolinq-nonprod), one Cloud SQL database, one Redis,
# one Secret Manager secret set, and ONE worker pool (lingolinq-worker-staging), which runs the
# STAGING image. OPERATIONAL RULE, documented not enforced: a job class, argument shape, or queue
# change on `develop` is not runnable until it merges to `staging`; dispatching develop with such
# a change enqueues work the staging worker cannot process and can break it for both environments. A dev deploy
# builds and ships the web service and runs ITS OWN migrate Job against the shared database
# (the same thing Render's preDeploy `db:migrate` did), but it must NOT deploy a worker pool or
# touch a scheduler Job: staging's worker drains the shared Redis for both. That is why the
# worker-pool, scheduler, and worker-readback steps are gated on the environment variable
# DEPLOY_WORKER == 'true' (production and staging true, dev false), and NOT on the environment
# name. Gating on a var keeps this file free of per-environment special cases; if dev ever
# gets its own worker, flip the var, do not edit the workflow.
#
# LIVE: a push to `main` CREATES a production deployment, which then proceeds once a reviewer
# approves it in the `production` environment. That deployment runs DB migrations against prod
# Cloud SQL, rolls out a new web revision with no traffic, health-checks it, shifts traffic,
# and replaces the worker pool. `workflow_dispatch` is retained for manual redeploys and
# rollforwards on any of the three mapped branches (see the `resolve` job).
#
# Do not read "every push deploys" too literally. A queued run can be cancelled while pending
# (see CONCURRENCY below), so a merge can be superseded before it ever deploys. And a run that
# sits unapproved does not deploy at all until someone acts on it.
#
# DO NOT assume `main` only receives vetted, staging-tested code. It does not. Release PRs from
# `staging` are the common case, but hotfix branches merge DIRECTLY into `main` and that is the
# intended workflow for urgent fixes (e.g. #734 scot/fix/bedrock-runtime-main-hotfix and #726
# scot/fix/empty-button-sets-prod-hotfix, both 2026-08-02/03). Nothing restricts the source
# branch of a PR into `main`. What makes automatic deploy acceptable is therefore NOT
# provenance, it is the four gates below, and removing any of them removes the safety:
#   1. Required status checks on `main` (rspec, build-and-test, audit-artifacts-integrity,
#      codex-review-tests, security-scan, secret-detection) with enforce_admins on, so no PR
#      merges red against the base it was tested against, whatever branch it came from.
#      Note `strict` is FALSE, deliberately: requiring every PR to be up to date with `main`
#      before merging would block a hotfix behind a merge-back. The residual risk is real --
#      a PR green against base X can merge after `main` has advanced to Y, so `main` can be
#      red while every individual merge was green. The health gate below catches only the
#      subset of that which stops the app booting or answering; it is a boot smoke test, not a
#      backstop for behavioural regressions, authorization bugs, or anything a test would find.
#   2. The `production` environment on the deploy job: `main`-only branch policy plus required
#      reviewers. A pause, an audit record, and a kill switch. NOT a two-person control; see
#      the note on the `environment:` key below for what actually enforces that.
#   3. The `resolve` branch map + each project's WIF provider `assertion.ref` condition, so no
#      other ref can deploy or even mint a deploy token. Production's provider admits only
#      refs/heads/main (ref_type branch); the nonprod provider admits refs/heads/staging and
#      refs/heads/develop (ref_type branch) and nothing else -- both verified live 2026-09-02
#      (the nonprod condition was added that day; before it the provider was repo-locked
#      only). A ref the map does not know is skipped here, and a ref the provider does not
#      know cannot authenticate even if this file were edited.
#   4. The candidate rollout: the new revision takes NO user traffic until it has answered
#      two consecutive health probes on its own tagged URL, and traffic is then pinned to
#      that exact verified revision by name.
# Staging and dev have gates 3 and 4 only. They have no required checks on merge and no
# approval pause. That is acceptable because they hold no real user data; it is NOT a
# template for production.
#
# MIGRATIONS MUST BE EXPAND-CONTRACT. This is a hard rule for anything that reaches `main`,
# and it is a consequence of the step order below, which no amount of care in this file can
# remove: migrate -> web -> worker. That order leaves two windows where schema and code
# disagree, and automation means nobody is watching them:
#   * Between the migrate Job and the web deploy, the NEW schema serves the OLD web code.
#   * Between the web deploy and the worker deploy, the NEW web code enqueues onto workers
#     still running the OLD image.
# So, in the release that changes the code:
#   ALLOWED  -- add a column/table/index, add a nullable field, backfill, add a new job class,
#               start dual-writing.
#   FORBIDDEN -- drop or rename a column/table, add a NOT NULL constraint without a default,
#               change a column type in place, or remove a job class that old workers may
#               still dequeue.
# Destructive changes ship in a LATER release, after the code that depended on the old shape
# is gone from production. If you cannot make a change expand-contract, do not put it through
# the automatic path: take the site down, or deploy it by hand with someone watching.
# On the shared nonprod database the same rule applies with an extra twist: a `develop`
# migration lands in the database `staging` is serving, so a destructive migration on
# `develop` breaks staging immediately.
#
# The inert guard still no-ops the run when the resolved environment's vars.GCP_PROJECT_ID is
# empty, so the workflow stays inert in a fork or a repo where that environment was never
# provisioned. It now lives as the FIRST STEP of the deploy job rather than a separate job,
# because environment-scoped vars are only readable under `environment:`, and a second job
# under `environment: production` would ask the reviewer for a second approval. Every later
# step is gated on that step's `enabled` output.
# Authentication is keyless via Workload Identity Federation -- no long-lived JSON
# service-account key is ever stored in GitHub.
#
# WHY `on: push` AND NOT `on: workflow_run` (CI-gated): a workflow_run trigger only fires when
# the workflow file is on the repo's DEFAULT branch, and this repo's default branch is
# `staging`, not `main`. A workflow_run-triggered run also resolves github.ref and GITHUB_SHA
# to the default branch, so it would build `staging` code and deploy it as prod unless every
# checkout and image tag were rewritten to workflow_run.head_sha. The CI gate belongs on the
# merge instead: require the CI checks on `main` in branch protection, so nothing reaches
# `main` red in the first place.
#
# CONCURRENCY: one group PER DATABASE, across BOTH triggers. `main` serializes on
# `deploy-cloudrun-production`; `staging` and `develop` serialize on (an unknown ref gets a
# per-run `noop-*` group so its skipped run cannot cancel a pending nonprod deploy)
# `deploy-cloudrun-nonprod`, because staging and dev share ONE database and must never run
# two migrate Jobs against it at once. Production and nonprod deploys may overlap; they touch
# different projects. Do not scope the group by ref. Three known limits, so nobody reads more
# safety into this than it provides:
#   - It is NOT a distributed lock. `gcloud run jobs execute --wait` is a client-side poll;
#     killing the GitHub job does not stop the server-side execution. If a run hits the job's
#     `timeout-minutes` ceiling, is cancelled, or its runner dies, the lock releases while the
#     execution may still be writing to the database. That ceiling is set above the migrate
#     Job's own `--task-timeout` precisely so a valid long migration cannot trip it, but a
#     cancel or a dead runner still can. A real mutex would need a Postgres advisory lock
#     inside the migration task. Tracked as follow-up, not solved here.
#   - GitHub keeps only ONE pending run per group and cancels the older pending one when a new
#     run queues, regardless of `cancel-in-progress`. Three merges in quick succession deploy
#     the 1st and 3rd; the 2nd shows `cancelled`. On a linear `main` that is benign, since the
#     3rd contains the 2nd, but it means "every push deploys" is not literally true. On the
#     nonprod group a `develop` push can cancel a pending `staging` push, or vice versa; the
#     cancelled branch simply needs a re-run (`gh workflow run deploy-cloudrun.yml --ref X`).
#   - A run AWAITING ENVIRONMENT APPROVAL counts as in-progress and holds its group for as
#     long as the approval sits unactioned, which can be days. Every merge to `main` behind it
#     queues, and each new one cancels the previously pending one. Approve or reject promptly;
#     an ignored approval quietly stops all production deploys (nonprod is unaffected: it is a
#     different group). Nothing in this workflow stops a late approval from shipping the commit
#     it was created for, even if `main` has moved on: see the note where the staleness guard
#     used to be. Reject stale approvals by hand.
# `cancel-in-progress: false` is still right: cancelling a run partway through the migration
# Job is the one thing guaranteed to hurt.
#
# Pipeline (when enabled): build image -> push to Artifact Registry -> run DB migration as a
# dedicated Cloud Run Job (gen2 + Cloud SQL) -> deploy web service -> (DEPLOY_WORKER only)
# deploy worker pool -> (DEPLOY_WORKER only) deploy scheduler Job (create-or-update, full config).
#
# MERGE-TIME NOTE for the change that introduced per-database concurrency groups: a run still
# queued or awaiting approval under the OLD group name `deploy-cloudrun` is not serialized
# against the first run under the new names. Merge only when no deploy-cloudrun run is pending.
#
# ---------------------------------------------------------------------------------------
# ENVIRONMENT VARIABLES each GitHub environment must define
# (Settings > Environments > <env> > Environment variables). Repository-level variables of the
# same name are a FALLBACK, not a scope: a job under `environment: staging` that finds no
# environment-scoped GCP_PROJECT_ID resolves the repository-level one, i.e. PRODUCTION's.
# So keep the GCP_* set ONLY at environment scope, never at repository scope, and let a
# half-configured environment resolve to empty and trip the inert guard instead. The guard
# also refuses to point a nonprod environment at the production project as a second defense.
#   GCP_PROJECT_ID         -- target GCP project id (empty = this environment stays inert)
#   GCP_REGION             -- e.g. us-central1
#   GCP_WIF_PROVIDER       -- full WIF provider resource name
#                             (projects/NNN/locations/global/workloadIdentityPools/POOL/providers/PROVIDER)
#   GCP_DEPLOY_SA          -- deploy service account email (cloud-run-deployer@PROJECT.iam.gserviceaccount.com)
#   GCP_CLOUDSQL_INSTANCE  -- Cloud SQL connection name (PROJECT:REGION:INSTANCE)
#   GCP_VPC_NETWORK        -- VPC network for Direct VPC egress (Memorystore Redis reachability)
#   GCP_VPC_SUBNET         -- VPC subnet for Direct VPC egress
#   DEPLOY_WORKER          -- 'true' to deploy the worker pool + update the scheduler Job
#                             (production, staging); anything else skips both (dev). Production
#                             REQUIRES 'true' and fails closed on anything else.
#   APP_UPLOADS_S3_BUCKET  -- REQUIRED. S3 bucket for user uploads
#   APP_STATIC_S3_BUCKET   -- REQUIRED. S3 bucket for static/system assets
#   APP_SENTRY_ENVIRONMENT -- REQUIRED. Sentry environment label
#   APP_UPLOADS_S3_CDN     -- optional in nonprod, REQUIRED in production. CloudFront origin fronting the
#                             uploads bucket; omitted when blank
#   APP_REDIS_NAMESPACE_SUFFIX -- optional. Resque namespace suffix; omitted when blank (prod blank).
#                             Staging and dev MUST share one value: one worker drains both.
#   APP_REMOTE_EXTRA_DATA  -- optional in nonprod, REQUIRED in production. '1' enables detach-to-S3 for big
#                             button sets; omitted when blank
#   APP_DEFAULT_HOST       -- optional. Overrides the Secret Manager DEFAULT_HOST at BUILD time only
#                             (window.default_host in the compiled frontend). Dev needs this because
#                             it shares staging's secrets but must be built for dev.lingolinq.com.
#                             Blank = read DEFAULT_HOST from Secret Manager (today's behaviour).
#   STRIPE_PUBLIC_KEY, NEW_REGISTRATION_EMAIL -- optional, unchanged; appended when set.
#
# RUNTIME IDENTITY: the web service, worker pool, and Jobs all RUN AS the runtime service
# account lingolinq-run@${GCP_PROJECT_ID}.iam.gserviceaccount.com (derived inline from
# GCP_PROJECT_ID, created by scripts/gcp/phase1-setup.sh in each project). This is NOT
# GCP_DEPLOY_SA (that SA only authenticates GitHub Actions via WIF). It is REQUIRED: without
# --service-account, Cloud Run defaults to the project's Editor-roled compute SA, which has
# no secretAccessor and therefore cannot read the boot secrets -- the app would fail to boot,
# and the least-privilege runtime SA + its per-secret grants would be inert. (PR #353 review.)
# ASSUMES the runtime SA is co-located with GCP_PROJECT_ID (one runtime SA per project).
# Cross-project use would require disabling the iam.disableCrossProjectServiceAccountUsage
# org policy.
# PHASE 3 PREREQ: grant roles/cloudsql.client to this runtime SA before enabling -- the
# migration Job, web service, and worker pool all connect to Cloud SQL (--set-cloudsql-instances)
# and will fail to authenticate at DB connect without it. (PR #353/#354 adversary review.)
# NOTE: worker pools are on the `gcloud beta` surface (not GA on SDK 564), hence `beta` below.
#
# GCP SECRET MANAGER secrets each project must seed (referenced by name via --set-secrets,
# NOT GitHub secrets; staging and dev read the SAME unsuffixed names in lingolinq-nonprod):
#   SECRET_KEY_BASE, SECURE_ENCRYPTION_KEY, SECURE_NONCE_KEY, DB_HOST, DB_NAME,
#   DB_USERNAME, DB_PASSWORD, REDIS_URL, DEFAULT_EMAIL_FROM, SYSTEM_ERROR_EMAIL, COOKIE_KEY,
#   DEFAULT_HOST. (DB_* replaced the single DATABASE_URL: the Cloud SQL socket URL is unparseable
#   by uri >= 1.0, so config/database.yml builds the connection from discrete params instead.)
#   REDIS_CA_CERT is seeded later by scripts/gcp/phase3-data-layer.sh (the Memorystore
#   per-instance CA, fetched from the live instance) -- the app's Redis client loads it to
#   verify the rediss:// TLS chain.
#
# MANUAL TRIGGER (redeploy without a new commit, or deploy a specific mapped branch):
#   gh workflow run deploy-cloudrun.yml --ref main       # production (approval required)
#   gh workflow run deploy-cloudrun.yml --ref staging    # staging
#   gh workflow run deploy-cloudrun.yml --ref develop    # dev
# Any other --ref resolves to no environment and the deploy job is skipped.
# ---------------------------------------------------------------------------------------

on:
  push:
    branches: [main, staging, develop]
  workflow_dispatch:

# Serialize deploys PER DATABASE across BOTH triggers: production alone, nonprod (staging +
# dev, one shared Cloud SQL) together. cancel-in-progress is deliberately false: see the
# CONCURRENCY note above. This expression must use `github.*` only; job outputs are not
# available at the workflow level.
concurrency:
  # An UNMAPPED ref (feature-branch dispatch) gets its own throwaway group keyed by run id, so a
  # no-op run can never cancel a pending staging or develop deploy by landing in the nonprod group.
  group: deploy-cloudrun-${{ github.ref == 'refs/heads/main' && 'production' || ((github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop') && 'nonprod' || format('noop-{0}', github.run_id)) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Branch -> environment map. Fail-closed: an unknown ref (including a workflow_dispatch on a
  # feature branch or a tag) yields an empty env_name and the deploy job is skipped with a
  # notice. This job has NO `environment:` and NO GCP access on purpose: it only reads
  # github.ref. Production is `main` and only `main`: without this map, ANY collaborator with
  # Actions write could `workflow_dispatch` this workflow on any branch and deploy it to prod,
  # migrations included. That is not hypothetical -- run 28881107723 (2026-07-07) deployed
  # `--ref staging` to production under the pre-map version of this file.
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.map.outputs.env_name }}
      svc_suffix: ${{ steps.map.outputs.svc_suffix }}
    steps:
      - id: map
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main)    env_name=production; svc_suffix="" ;;
            refs/heads/staging) env_name=staging;    svc_suffix="-staging" ;;
            refs/heads/develop) env_name=dev;        svc_suffix="-dev" ;;
            *)                  env_name="";         svc_suffix="" ;;
          esac
          if [ -z "$env_name" ]; then
            echo "::notice::Ref '$REF' is not mapped to a deploy environment (main|staging|develop). Deploying nothing."
          else
            echo "Ref '$REF' -> environment '$env_name', resource suffix '${svc_suffix:-<none>}'."
          fi
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "svc_suffix=$svc_suffix" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and deploy (${{ needs.resolve.outputs.env_name || 'skipped' }})
    needs: resolve
    # Only a mapped ref reaches here. Do NOT add `vars.*` to this job-level `if`: environment
    # scoping is applied once the job starts, so an environment-scoped var read here would
    # resolve at repository scope (production's, or empty). Var-driven gates live in the
    # `guard` STEP below.
    if: needs.resolve.outputs.env_name != ''
    runs-on: ubuntu-latest
    # The GitHub environment selected by `resolve`. For `production` this is the protected
    # environment: `main`-only deployment branch policy plus required reviewers. What that
    # actually gives you, stated precisely so nobody over-trusts it: a PAUSE before anything
    # touches prod, a Deployments API AUDIT RECORD of who released what, and a KILL SWITCH
    # (disable the environment and auto-deploy stops without editing this file). It is NOT a
    # two-person control: `prevent_self_review` is false, so whoever merges can approve their
    # own deployment. That is deliberate, so a single on-call engineer can ship a hotfix at
    # 2am. The actual two-person control is upstream and stronger: CODEOWNERS
    # (`* @swahlquist @MelissaOneil`) plus `require_code_owner_reviews` plus a required
    # approving review on `main`, which forces a second human onto every PR that gets here.
    # `staging` and `dev` carry no protection rules and proceed immediately.
    environment: ${{ needs.resolve.outputs.env_name }}
    # 90, not 45. The migrate Job is allowed --task-timeout 3600s (60 min), so a 45 minute job
    # ceiling could cancel the workflow WHILE a valid long migration is still running
    # server-side: GitHub would release the concurrency slot and report failure while the
    # database is mid-DDL. This ceiling must stay strictly greater than build + 3600s + deploys
    # + probes.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ needs.resolve.outputs.env_name }}
      SVC_SUFFIX: ${{ needs.resolve.outputs.svc_suffix }}
      # Resource names. Production's suffix is empty, so these resolve to EXACTLY the names
      # production has always used. Nonprod gets `-staging` / `-dev`.
      WEB_SERVICE: lingolinq-web${{ needs.resolve.outputs.svc_suffix }}
      WORKER_POOL: lingolinq-worker${{ needs.resolve.outputs.svc_suffix }}
      MIGRATE_JOB: lingolinq-migrate${{ needs.resolve.outputs.svc_suffix }}
      SCHEDULER_JOB: lingolinq-scheduler${{ needs.resolve.outputs.svc_suffix }}
      # Environment-scoped GCP target. Read once here, used as shell vars everywhere below.
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE }}
      GCP_VPC_NETWORK: ${{ vars.GCP_VPC_NETWORK }}
      GCP_VPC_SUBNET: ${{ vars.GCP_VPC_SUBNET }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      RUNTIME_SA: lingolinq-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lingolinq/web:${{ github.sha }}
      # Boot-mandatory secret set. Any `rake environment` / puma boot of this app in
      # production loads these (see the asset-precompile env block in the Dockerfile).
      # The worker (rake environment resque:work) and the migration Job (rake db:migrate)
      # both fully boot Rails, so they need the same boot set as the web service -- not a
      # narrower subset, which would crash them on boot. config/environment.rb hard-requires
      # DEFAULT_EMAIL_FROM and SYSTEM_ERROR_EMAIL at boot for EVERY process, so they belong here
      # (not in a web-only extra set) or the migrate/seed Jobs crash on boot.
      # DB connection is configured from discrete params (config/database.yml production stanza), NOT a
      # DATABASE_URL: the Cloud SQL socket-form URL (empty host) is rejected by uri >= 1.0 at boot.
      # DB_HOST is the Cloud SQL unix socket dir (/cloudsql/<conn>); database.yml defaults DB_SSLMODE
      # to 'disable' for the socket.
      BOOT_SECRETS: SECRET_KEY_BASE=SECRET_KEY_BASE:latest,COOKIE_KEY=COOKIE_KEY:latest,SECURE_ENCRYPTION_KEY=SECURE_ENCRYPTION_KEY:latest,SECURE_NONCE_KEY=SECURE_NONCE_KEY:latest,DB_HOST=DB_HOST:latest,DB_NAME=DB_NAME:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,REDIS_URL=REDIS_URL:latest,REDIS_CA_CERT=REDIS_CA_CERT:latest,DEFAULT_HOST=DEFAULT_HOST:latest,DEFAULT_EMAIL_FROM=DEFAULT_EMAIL_FROM:latest,SYSTEM_ERROR_EMAIL=SYSTEM_ERROR_EMAIL:latest
      # Non-boot APP secrets (migration 4.E1): S3/SES creds + Google/Stripe/AI/Sentry/SMS + misc
      # integration tokens. Lazy-loaded at use time, NOT at boot -- so they go on the web service and
      # worker pool ONLY, never the migration Job (which boots Rails for db:migrate but needs none of
      # these). Seeded by scripts/gcp/phase4-seed-app-secrets.sh (Render-prod-first; AWS_KEY/AWS_SECRET
      # are the NEW least-priv IAM user, scripts/gcp/iam/). Every name here is asserted to have a
      # SEEDED VERSION in Secret Manager by the "Assert referenced secrets exist + assemble
      # runtime env" step before deploy.
      # MAPS_KEY is intentionally NOT here: it is a client-public key emitted at asset-precompile
      # (globals.js.erb), not read at runtime, so it is passed as a Docker build ARG in the
      # "Build and push image" step (alongside DEFAULT_HOST), not mounted at runtime.
      #
      # BEDROCK_AWS_KEY / BEDROCK_AWS_SECRET are the Tier 1 runtime AI credentials read by
      # lib/ai_client.rb (board generation, word prediction, prediction seeding, eval narration).
      # They are SEPARATE from AWS_KEY/AWS_SECRET on purpose: those are the least-privilege S3/SES
      # IAM user (scripts/gcp/iam/lingolinq-cloudrun-s3-ses-policy.json) and have no Bedrock invoke
      # permission. ai_client.rb deliberately refuses to fall back to them, because doing so once
      # made `configured?` true while every request returned AccessDenied. Both halves are required;
      # a partial pair is ignored atomically. No BEDROCK_AWS_REGION entry is needed while Bedrock
      # runs in the same region as S3: bedrock_region falls back to AWS_REGION, already set to
      # us-west-2 in APP_ENV_VARS_STATIC. If Bedrock moves region, add BEDROCK_AWS_REGION there
      # (a region string is not a secret and does not belong in this list).
      #
      # ANTHROPIC_API_KEY was REMOVED from this list on 2026-08-15. It had been inert since the
      # Bedrock cutover -- no code under app/ lib/ config/ reads it, and lib/ai_client.rb never
      # constructs a direct api.anthropic.com client -- so it was mounting a live credential into
      # every web and worker container with no consumer. scripts/ai-endpoint-guard.sh already
      # fails CI if any runtime seam starts reading it, so the guarantee does not depend on this
      # list. Do not re-add it: the direct Anthropic route is not a BAA path for runtime AI.
      #
      # GEMINI_API_KEY was REMOVED from this list on 2026-08-18. The Gemini fallback was disabled
      # 2026-07-09, PR #570, and its Render/GCP provisioning inputs were removed in the follow-up
      # cleanup. The existing GCP Secret Manager item is intentionally not deleted here. Do not
      # re-add the key: the Gemini Developer/AI-Studio route is not an approved Tier 1 runtime path.
      NON_BOOT_SECRETS: AWS_KEY=AWS_KEY:latest,AWS_SECRET=AWS_SECRET:latest,BEDROCK_AWS_KEY=BEDROCK_AWS_KEY:latest,BEDROCK_AWS_SECRET=BEDROCK_AWS_SECRET:latest,GOOGLE_TTS_TOKEN=GOOGLE_TTS_TOKEN:latest,GOOGLE_PLACES_TOKEN=GOOGLE_PLACES_TOKEN:latest,GOOGLE_TRANSLATE_TOKEN=GOOGLE_TRANSLATE_TOKEN:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,SMS_ENCRYPTION_KEY=SMS_ENCRYPTION_KEY:latest,INTERNAL_API_TOKEN=INTERNAL_API_TOKEN:latest,CACHE_TOKEN=CACHE_TOKEN:latest,OPENSYMBOLS_SECRET=OPENSYMBOLS_SECRET:latest,IPLOCATE_API_KEY=IPLOCATE_API_KEY:latest,YOUTUBE_API_KEY=YOUTUBE_API_KEY:latest
      # Non-secret runtime config (Group B) + perf tuning (Group C), web + worker only. This is
      # the ENVIRONMENT-INDEPENDENT part: identical in production, staging, and dev. The
      # environment-specific part (buckets, CDN, Sentry env, Redis namespace, REMOTE_EXTRA_DATA,
      # Stripe publishable key, registration email) is assembled from `vars.APP_*` in the
      # "Assert referenced secrets exist + assemble runtime env" step below, so no per-environment
      # value is committed here. LD_PRELOAD/MALLOC_CONF are DELIBERATELY EXCLUDED until jemalloc is
      # verified present in the image -- pointing LD_PRELOAD at a missing .so breaks boot (plan
      # Group C). RAILS_ENV is set inline on every deploy (it is `production` in ALL THREE
      # environments; SENTRY_ENVIRONMENT is what distinguishes them); DEPLOY_TRIGGER/SEED_READY/
      # LEADER_POSTGRES_URL are Render-only.
      # UPLOADS_S3_NO_ACL=1: lingolinq-prod-uploads is BucketOwnerEnforced (ACLs disabled) +
      # Block Public Access, per the private-bucket model (Scot, 2026-07-05). A presigned POST
      # carrying acl=public-read is rejected by such a bucket, so lib/uploader.rb must omit the
      # ACL field. Client-facing reads go through presigned GETs / CDN, not public object URLs.
      # Kept as a constant for every environment: the nonprod uploads bucket must follow the
      # same private-bucket model, or presigned uploads there will fail for the opposite reason.
      # UPLOADS_S3_CDN (now vars.APP_UPLOADS_S3_CDN): in production, CloudFront distribution
      # E2X2HAS6Y1L2MI fronts the private bucket via Origin Access Control (bucket policy + KMS
      # key policy grant scoped to the distribution ARN). Uploader.fronted_url rewrites stored
      # bucket URLs to this domain at serialization time; stable (non-presigned) URLs are
      # required by the Ember offline cache, which is URL-keyed and does not strip X-Amz-*
      # params. Nonprod has no distribution; the var is blank there and the env var is OMITTED,
      # which lib/uploader.rb handles (falls back to the bucket URL).
      # REMOTE_EXTRA_DATA=1 (now vars.APP_REMOTE_EXTRA_DATA): gates the detach-to-S3 path for
      # BoardDownstreamButtonSet buttons and LogSession events (ExtraData#extra_data_too_big?).
      # With it unset, BoardDownstreamButtonSet#generate_defaults still stripped data['buttons']
      # for any set over 200 buttons while detach_extra_data no-op'd, destroying the set on
      # the next save -- which zeroed 1754 of 2061 prod button sets (find-a-button and
      # button-set loading broken library-wide, diagnosed 2026-08-01, PR #724).
      # PROVENANCE, do not restate this as a migration regression without checking:
      # the variable is absent from tracked config everywhere in this repo AND from the
      # 2026-06-30 45-var Render prod env accounting, so it was most likely never set on
      # Render prod either. Vintage unknown; it was NOT confirmed to be a GCP cutover drop.
      # Enabling it in production is a deliberate enablement decision (Scot, 2026-08-01),
      # not a restoration: the code now degrades safely to inline storage when this is
      # unset, but inline means every button set lives in Postgres and ships whole in the
      # API response (~1MB for a 3717-button set), which is a bad steady state. The code
      # checks `!!ENV['REMOTE_EXTRA_DATA']`, i.e. PRESENCE, so a blank var must OMIT the env
      # var entirely rather than set it to "" -- an empty string is truthy in Ruby.
      # BEDROCK_EXPECTED_AWS_ACCOUNT: the AWS account docs/legal/AWS_BAA_ACCEPTED.md is scoped to.
      # AiClient.account_verified? calls sts:GetCallerIdentity under the exact Bedrock credential
      # and REFUSES to build a client unless the account matches, so a credential belonging to any
      # other account fails AI closed instead of putting PHI-bearing inference outside the BAA
      # boundary (finding LL-1b0d78dbe6). An account id is an identifier, not a secret -- it is
      # already quoted throughout docs/legal -- so it belongs here, not in Secret Manager. It lives
      # in config rather than in Ruby so an account migration is a config change. Losing it is a
      # silent-disable risk (unset means AiClient SKIPS the check), so it is defended twice: the
      # lint step below catches an edit to THIS file before deploying, and the "Assert deployed
      # secrets landed" readback catches a value that did not land on the revision. It is the
      # same account in every environment; nonprod Bedrock credentials must also belong to it.
      # NOT covered: drift introduced outside this workflow (a hand-run `gcloud run deploy`, a
      # Cloud Run console edit). That needs a scheduled reconciler, which is deliberately not in
      # this change -- see the follow-up issue. Until it exists, the readback only proves the
      # state of a revision THIS workflow deployed.
      # SES_CONFIGURATION_SET: MUST live in this list, not be set by hand on the service.
      # It was set live on web+worker on 2026-07-11 as the remediation that closed
      # LL-42a24ee911, and by 2026-09-01 it was gone from BOTH -- because the deploys below
      # use --set-env-vars, which REPLACES the whole env set, and this list did not contain it.
      # That is the same mechanism the comment above describes for the Bedrock pair on revision
      # 00014. Without it, SesConfigurationSetInterceptor is a documented no-op, every send goes
      # out untagged, and the lingolinq-transactional configuration set's SNS->SQS event
      # destination (verified live, 1 confirmed subscription) receives nothing -- so there is no
      # per-message delivery/bounce/complaint record for any real user email.
      APP_ENV_VARS_STATIC: BEDROCK_EXPECTED_AWS_ACCOUNT=239044785114,AWS_REGION=us-west-2,SES_REGION=us-west-2,SES_CONFIGURATION_SET=lingolinq-transactional,UPLOADS_S3_NO_ACL=1,RAILS_LOG_TO_STDOUT=true,RAILS_SERVE_STATIC_FILES=true,RUBY_YJIT_ENABLE=1,WEB_CONCURRENCY=2
      # REDIS_TLS_VERIFY_HOSTNAME=false is set on every deploy below: Memorystore is reached by
      # private IP and its server cert is issued for the instance, not the IP, so hostname
      # matching cannot pass. CA-chain verification (VERIFY_PEER against REDIS_CA_CERT) stays on.
      # See config/initializers/resque.rb.
    steps:
      # INERT GUARD + var-driven gates, as the first step of the (possibly approved) job. See the
      # header for why this is a step and not a job: environment-scoped vars are only readable
      # under `environment:`, and a separate job under `environment: production` would cost a
      # second reviewer approval. Every step below is gated on `enabled`; the worker-pool,
      # scheduler, and worker-readback steps are additionally gated on `deploy_worker`.
      # Consequence, stated honestly: when a PROTECTED environment's GCP_PROJECT_ID is blank,
      # the reviewer is still asked to approve a run that will then no-op. In this repo the
      # production vars are always set, so that only bites a fork.
      - name: Check deploy readiness for this environment
        id: guard
        env:
          DEPLOY_WORKER: ${{ vars.DEPLOY_WORKER }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_PROJECT_ID:-}" ]; then
            echo "::notice::GCP_PROJECT_ID is not set in GitHub environment '$ENV_NAME'. This environment is inert until it is provisioned. No-op."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "deploy_worker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Second defense against repository-level fallback (see the header): a nonprod
          # environment must never resolve to the production project. Deliberately a literal:
          # the production project id is fixed by scripts/gcp/phase1-setup.sh and this check
          # has to work even when the nonprod environment is the thing that is misconfigured.
          if [ "$ENV_NAME" != "production" ] && [ "$GCP_PROJECT_ID" = "lingolinq-prod" ]; then
            echo "::error::Environment '$ENV_NAME' resolved GCP_PROJECT_ID=lingolinq-prod. A nonprod branch must never deploy into the production project."
            echo "::error::Most likely the '$ENV_NAME' GitHub environment is missing its own GCP_* variables and fell through to repository-level ones. Fix the environment; do not edit this check."
            exit 1
          fi
          for v in GCP_REGION GCP_CLOUDSQL_INSTANCE GCP_VPC_NETWORK GCP_VPC_SUBNET GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            [ -n "${!v:-}" ] || { echo "::error::$v is not set in GitHub environment '$ENV_NAME'."; exit 1; }
          done
          # The deploy identity must live in the same project as the target. A nonprod environment
          # that fell through to production's WIF provider or deploy SA would otherwise only be
          # stopped by prod's provider rejecting the ref, which is a control in another system.
          if [ "$ENV_NAME" != "production" ]; then
            case "$GCP_WIF_PROVIDER$GCP_DEPLOY_SA" in
              *549902645644*|*lingolinq-prod*)
                echo "::error::Environment '$ENV_NAME' resolved a PRODUCTION deploy identity (GCP_WIF_PROVIDER/GCP_DEPLOY_SA). Fix the environment's variables; refusing to authenticate."
                exit 1 ;;
            esac
            # Same reasoning for the data plane: a nonprod environment that inherited the prod
            # Cloud SQL connection name would otherwise be stopped only by the nonprod runtime
            # SA lacking cloudsql.client on lingolinq-prod, i.e. a control in another project.
            # Reject it here instead.
            #
            # WHAT THIS ACTUALLY CATCHES, stated honestly. The Cloud SQL half is the live
            # control: prod's connection name is lingolinq-prod:us-central1:lingolinq-prod-pg,
            # which carries the project id. The VPC half catches almost nothing on its own,
            # because BOTH projects name their network `lingolinq-vpc` (verified 2026-09-03)
            # and a bare `--network` name resolves within the DEPLOY project, so a nonprod
            # deploy cannot reach prod's VPC by name alone. It is kept only for the Shared-VPC
            # form `projects/<PROJECT>/global/networks/<NAME>`, where an id or a project NUMBER
            # would appear -- hence the number below, matching the identity guard three lines
            # up. An earlier version of this guard omitted the number and named GCP_VPC_NETWORK
            # in its error as though it were protected; do not read the VPC half as more than
            # the Shared-VPC case.
            case "$GCP_CLOUDSQL_INSTANCE:$GCP_VPC_NETWORK" in
              *lingolinq-prod*|*549902645644*)
                echo "::error::Environment '$ENV_NAME' resolved a PRODUCTION data-plane target (GCP_CLOUDSQL_INSTANCE='$GCP_CLOUDSQL_INSTANCE', GCP_VPC_NETWORK='$GCP_VPC_NETWORK'). Refusing to migrate or deploy against it."
                exit 1 ;;
            esac
          fi
          case "$GCP_DEPLOY_SA" in
            *"@${GCP_PROJECT_ID}.iam.gserviceaccount.com") ;;
            *) echo "::error::GCP_DEPLOY_SA '$GCP_DEPLOY_SA' is not a service account in project '$GCP_PROJECT_ID'."; exit 1 ;;
          esac
          echo "Environment '$ENV_NAME' -> project '$GCP_PROJECT_ID' ($GCP_REGION); web=$WEB_SERVICE migrate=$MIGRATE_JOB"
          # Production MUST move its worker pool and scheduler in the same release (expand-contract
          # assumes it). A missing, renamed, or mis-cased DEPLOY_WORKER in the production
          # environment is a configuration error, not a request to skip the worker: fail closed.
          if [ "$ENV_NAME" = "production" ] && [ "${DEPLOY_WORKER:-}" != "true" ]; then
            echo "::error::DEPLOY_WORKER is '${DEPLOY_WORKER:-<unset>}' in the production environment; it must be exactly 'true'. Refusing to ship web without the worker pool."
            exit 1
          fi
          if [ "${DEPLOY_WORKER:-}" = "true" ]; then
            echo "DEPLOY_WORKER=true: worker pool '$WORKER_POOL' and scheduler Job '$SCHEDULER_JOB' will be updated after the traffic shift."
            echo "deploy_worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY_WORKER is not 'true': worker pool and scheduler Job will NOT be touched (shared-worker environment)."
            echo "deploy_worker=false" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v6

      # NO STALENESS GUARD HERE, DELIBERATELY. An earlier version of this workflow had one, and
      # it could not work: `actions/checkout` fetches refspec `+<github.sha>:refs/remotes/origin/<branch>`
      # on a push event, so after checkout the remote-tracking ref IS this run's own SHA. Any
      # comparison against the checkout-local ref is a tautology that passes on every input,
      # including a genuinely stale one, while printing two matching SHAs and a green check. A
      # control that cannot fail is worse than a documented gap, because people trust it.
      #
      # THE GAP, stated plainly: an environment approval can sit for days, and the job then
      # resumes with the ORIGINAL github.sha. Approving a forgotten deployment ships that
      # commit, and its migrations, onto a schema that may have moved. Nothing here stops it.
      # Mitigation is procedural: approve or reject promptly (the concurrency note above
      # explains why a pending approval also blocks every later deploy), and if an approval is
      # older than the current tip of `main`, reject it and let the newer run deploy.
      #
      # If this is re-introduced, it MUST resolve the tip from the API rather than the local
      # ref -- `gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha` --
      # and it MUST be tested against a deliberately stale SHA before anyone relies on it.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.guard.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: steps.guard.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          # `gcloud beta run worker-pools deploy` needs the beta component; gcloud 568+
          # on the runner no longer preinstalls it, and the on-demand install prompt
          # fails in a non-interactive job (run 28843502297, 2026-07-07).
          install_components: beta

      - name: Configure Docker for Artifact Registry
        if: steps.guard.outputs.enabled == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        if: steps.guard.outputs.enabled == 'true'
        env:
          V_APP_DEFAULT_HOST: ${{ vars.APP_DEFAULT_HOST }}
        run: |
          set -euo pipefail
          # globals.js.erb bakes window.maps_key + window.default_host at asset-precompile (build
          # time), so the real client-public values must reach the build as ARGs -- a runtime secret
          # mount is too late (the asset is already compiled, and on GCP would otherwise bake
          # default_host=localhost + omit maps_key). Both are fetched from Secret Manager as the
          # deploy SA (which already reads DEFAULT_HOST for the boot set; MAPS_KEY granted alongside).
          # Values are client-public (emitted to the browser) and never echoed.
          #
          # vars.APP_DEFAULT_HOST, when non-blank, OVERRIDES the Secret Manager DEFAULT_HOST for the
          # BUILD ONLY. Staging and dev share one secret set in lingolinq-nonprod, so the DEFAULT_HOST
          # secret can hold only one of their hosts; the var lets dev's frontend be compiled for
          # dev.lingolinq.com while its runtime DEFAULT_HOST secret (boot set, below) stays shared.
          # Format matches what Render used: the full origin, trailing slash allowed
          # (e.g. https://staging.lingolinq.com/). Both consumers tolerate either form --
          # capabilities.js strips a trailing slash and prefixes https:// on a bare host, and
          # JsonApi::Json.absolute_host does the same server-side. Blank = today's behaviour.
          MAPS_KEY="$(gcloud secrets versions access latest --secret=MAPS_KEY --project="$GCP_PROJECT_ID")"
          if [ -n "${V_APP_DEFAULT_HOST:-}" ]; then
            APP_DEFAULT_HOST="$V_APP_DEFAULT_HOST"
            echo "Building frontend for DEFAULT_HOST from vars.APP_DEFAULT_HOST (environment '$ENV_NAME')."
          else
            APP_DEFAULT_HOST="$(gcloud secrets versions access latest --secret=DEFAULT_HOST --project="$GCP_PROJECT_ID")"
            echo "Building frontend for DEFAULT_HOST from Secret Manager (project '$GCP_PROJECT_ID')."
          fi
          docker build \
            --build-arg MAPS_KEY="$MAPS_KEY" \
            --build-arg APP_DEFAULT_HOST="$APP_DEFAULT_HOST" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Assert referenced secrets exist + assemble runtime env
        if: steps.guard.outputs.enabled == 'true'
        # Pre-deploy guard (env-reconciliation 4.E1 adversary ask): every Secret Manager secret the
        # migrate Job / web / worker reference MUST already exist in THIS environment's project, or
        # the deploy fails fast HERE with a clear list -- instead of a Cloud Run revision that
        # crash-loops on a missing secret mount.
        # Then assemble APP_ENV_VARS: the static Group-B/C config plus the environment-specific
        # values from `vars.APP_*` (passed via env:, never interpolated into the shell).
        # REQUIRED (fail closed when blank): UPLOADS_S3_BUCKET, STATIC_S3_BUCKET, SENTRY_ENVIRONMENT.
        # A blank bucket would make the app fall back to a hard-coded bucket name (`lingolinq`,
        # see app/models/user.rb / lib/uploader.rb), i.e. silently write somewhere unintended.
        # OPTIONAL (omitted entirely when blank, never set to ""): UPLOADS_S3_CDN,
        # REDIS_NAMESPACE_SUFFIX, REMOTE_EXTRA_DATA, STRIPE_PUBLIC_KEY, NEW_REGISTRATION_EMAIL.
        # Omission matters: REMOTE_EXTRA_DATA is a presence check in Ruby, and
        # config/initializers/resque.rb only falls through to its default namespace when
        # REDIS_NAMESPACE_SUFFIX is UNSET, not when it is empty.
        env:
          V_UPLOADS_S3_BUCKET: ${{ vars.APP_UPLOADS_S3_BUCKET }}
          V_STATIC_S3_BUCKET: ${{ vars.APP_STATIC_S3_BUCKET }}
          V_UPLOADS_S3_CDN: ${{ vars.APP_UPLOADS_S3_CDN }}
          V_SENTRY_ENVIRONMENT: ${{ vars.APP_SENTRY_ENVIRONMENT }}
          V_REDIS_NAMESPACE_SUFFIX: ${{ vars.APP_REDIS_NAMESPACE_SUFFIX }}
          V_REMOTE_EXTRA_DATA: ${{ vars.APP_REMOTE_EXTRA_DATA }}
          V_STRIPE_PUBLIC_KEY: ${{ vars.STRIPE_PUBLIC_KEY }}
          V_NEW_REGISTRATION_EMAIL: ${{ vars.NEW_REGISTRATION_EMAIL }}
        run: |
          set -euo pipefail
          missing=""
          for pair in $(printf '%s,%s' "$BOOT_SECRETS" "$NON_BOOT_SECRETS" | tr ',' '\n'); do
            name="${pair%%=*}"
            # Verify an ENABLED version EXISTS, without reading its value. phase1-setup.sh creates all
            # secrets EMPTY, and `--set-secrets NAME:latest` crash-loops the revision if NAME has no
            # enabled version. `describe` would pass an empty container; listing enabled versions does not.
            # This deliberately uses `versions list` (needs only secretmanager.viewer) instead of
            # `versions access` (needs secretAccessor / reads the value): the deploy SA is least-privilege
            # and must NOT be able to read every app secret just to run this presence probe. `|| true`
            # keeps a NOT_FOUND (missing container) from tripping `set -e`; empty output -> flagged below.
            v="$(gcloud secrets versions list "$name" --project="$GCP_PROJECT_ID" \
                   --filter='state:ENABLED' --format='value(name)' --limit=1 2>/dev/null || true)"
            [ -n "$v" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) missing or unseeded (no version) in Secret Manager (project $GCP_PROJECT_ID):$missing"
            echo "Seed them with scripts/gcp/phase4-seed-boot-secrets.sh / phase4-seed-app-secrets.sh before deploying."
            exit 1
          fi
          echo "All $(printf '%s,%s' "$BOOT_SECRETS" "$NON_BOOT_SECRETS" | tr ',' '\n' | grep -c .) referenced secrets exist."
          missing_vars=""
          [ -n "${V_UPLOADS_S3_BUCKET:-}" ]  || missing_vars="$missing_vars APP_UPLOADS_S3_BUCKET"
          [ -n "${V_STATIC_S3_BUCKET:-}" ]   || missing_vars="$missing_vars APP_STATIC_S3_BUCKET"
          [ -n "${V_SENTRY_ENVIRONMENT:-}" ] || missing_vars="$missing_vars APP_SENTRY_ENVIRONMENT"
          # In production these two are not optional: UPLOADS_S3_CDN is what the URL-keyed Ember
          # offline cache depends on, and REMOTE_EXTRA_DATA unset is the exact state that zeroed
          # 1754 of 2061 button sets (PR #724, see the header). A blank value in the production
          # environment is a configuration error, never an intended omission.
          if [ "$ENV_NAME" = "production" ]; then
            [ -n "${V_UPLOADS_S3_CDN:-}" ]    || missing_vars="$missing_vars APP_UPLOADS_S3_CDN"
            [ -n "${V_REMOTE_EXTRA_DATA:-}" ] || missing_vars="$missing_vars APP_REMOTE_EXTRA_DATA"
          fi
          if [ -n "$missing_vars" ]; then
            echo "::error::Required environment variable(s) blank in GitHub environment '$ENV_NAME':$missing_vars"
            echo "Set them under Settings > Environments > $ENV_NAME > Environment variables."
            exit 1
          fi
          # Shape check: these values are concatenated into a comma-delimited --set-env-vars list and
          # written to GITHUB_ENV. A comma would split into bogus env vars; whitespace or a newline
          # would inject entries into every later step. Only admins can set them, so this is blast
          # radius control, not privilege escalation -- but it is cheap and fails before any deploy.
          for pair in "APP_UPLOADS_S3_BUCKET=$V_UPLOADS_S3_BUCKET" "APP_STATIC_S3_BUCKET=$V_STATIC_S3_BUCKET" \
                      "APP_UPLOADS_S3_CDN=${V_UPLOADS_S3_CDN:-}" "APP_SENTRY_ENVIRONMENT=$V_SENTRY_ENVIRONMENT" \
                      "APP_REDIS_NAMESPACE_SUFFIX=${V_REDIS_NAMESPACE_SUFFIX:-}" "APP_REMOTE_EXTRA_DATA=${V_REMOTE_EXTRA_DATA:-}" \
                      "STRIPE_PUBLIC_KEY=${V_STRIPE_PUBLIC_KEY:-}" "NEW_REGISTRATION_EMAIL=${V_NEW_REGISTRATION_EMAIL:-}"; do
            val="${pair#*=}"
            # Shell pattern, not grep: grep is line-oriented and a value containing a newline would
            # pass it. `[:space:]` here includes newline, tab, and carriage return.
            case "$val" in
              *[,[:space:]]*)
                echo "::error::GitHub variable ${pair%%=*} in environment '$ENV_NAME' contains a comma or whitespace; refusing to build the runtime env from it."
                exit 1 ;;
            esac
          done
          ev="$APP_ENV_VARS_STATIC"
          ev="$ev,UPLOADS_S3_BUCKET=$V_UPLOADS_S3_BUCKET"
          ev="$ev,STATIC_S3_BUCKET=$V_STATIC_S3_BUCKET"
          ev="$ev,SENTRY_ENVIRONMENT=$V_SENTRY_ENVIRONMENT"
          [ -n "${V_UPLOADS_S3_CDN:-}" ]         && ev="$ev,UPLOADS_S3_CDN=$V_UPLOADS_S3_CDN"
          [ -n "${V_REDIS_NAMESPACE_SUFFIX:-}" ] && ev="$ev,REDIS_NAMESPACE_SUFFIX=$V_REDIS_NAMESPACE_SUFFIX"
          [ -n "${V_REMOTE_EXTRA_DATA:-}" ]      && ev="$ev,REMOTE_EXTRA_DATA=$V_REMOTE_EXTRA_DATA"
          [ -n "${V_STRIPE_PUBLIC_KEY:-}" ]      && ev="$ev,STRIPE_PUBLIC_KEY=$V_STRIPE_PUBLIC_KEY"
          [ -n "${V_NEW_REGISTRATION_EMAIL:-}" ] && ev="$ev,NEW_REGISTRATION_EMAIL=$V_NEW_REGISTRATION_EMAIL"
          echo "APP_ENV_VARS=$ev" >> "$GITHUB_ENV"
          # Values are non-secret by construction (buckets, labels, a publishable key); print the
          # NAMES so a wrong-environment deploy is visible in the log without leaking anything new.
          echo "Runtime env for '$ENV_NAME': $(printf '%s' "$ev" | tr ',' '\n' | cut -d= -f1 | tr '\n' ' ')"

      - name: Lint the BAA account var in this workflow's own config
        if: steps.guard.outputs.enabled == 'true'
        # SCOPE, stated honestly: this is a fail-FAST lint of a value authored above in this same
        # file. It catches an edit to APP_ENV_VARS_STATIC that drops or mistypes
        # BEDROCK_EXPECTED_AWS_ACCOUNT, and it catches it BEFORE a bad revision is deployed rather
        # than after. That is its entire value.
        #
        # It is NOT the control, and must not be mistaken for one. It cannot detect drift,
        # because it never reads live state -- it compares a literal against itself. The
        # actual control is two layers: AiClient.account_verified? enforces the account at
        # runtime under the real credential, and the "Assert deployed secrets landed" step
        # below reads the DEPLOYED revision back and fails if the variable did not land or
        # does not look like an account id. Only that readback survives a hand-run
        # `gcloud run deploy`, whose --set-env-vars replaces the whole env set independently
        # of --set-secrets, which is exactly how revision 00014 lost the Bedrock pair.
        #
        # The account check itself deliberately does NOT run in CI at all: this job executes
        # as the deploy service account, which cannot read BEDROCK_AWS_KEY (granted
        # secretmanager.viewer, never secretAccessor -- see the presence probe above), so
        # verifying the account here would mean expanding that grant. The app does it under
        # the exact credential, at no extra privilege.
        run: |
          set -euo pipefail
          account="$(printf '%s' "$APP_ENV_VARS" | tr ',' '\n' \
                      | sed -n 's/^BEDROCK_EXPECTED_AWS_ACCOUNT=//p' | head -1)"
          if [ -z "$account" ]; then
            echo "::error::BEDROCK_EXPECTED_AWS_ACCOUNT is not in APP_ENV_VARS. Without it AiClient"
            echo "skips the sts:GetCallerIdentity account assertion, so a Bedrock credential from a"
            echo "non-BAA'd AWS account would be used silently. Restore it in APP_ENV_VARS_STATIC."
            exit 1
          fi
          # Deliberately stricter than AiClient.expected_aws_account, which strips punctuation
          # so the grouped form 2390-4478-5114 used in docs/legal still matches. This value is
          # authored here, so it should be canonical. Note the app no longer treats an
          # unparseable value as "unconfigured": it refuses loudly. Strict where we write it,
          # tolerant-then-strict where we read it.
          if ! printf '%s' "$account" | grep -Eq '^[0-9]{12}$'; then
            echo "::error::BEDROCK_EXPECTED_AWS_ACCOUNT='$account' is not a 12-digit AWS account id."
            exit 1
          fi
          echo "BAA account var is well-formed in this workflow's config (account $account)."
          echo "This is a config lint, not a drift check. The readback step is the control."

      - name: Run database migration (Cloud Run Job)
        if: steps.guard.outputs.enabled == 'true'
        # Strictly incremental: db:migrate only. NEVER db:prepare here -- db:prepare can
        # load db/schema.rb (force: :cascade drops tables) if it decides the DB is
        # uninitialized, which against a populated/misconfigured DATABASE_URL would
        # irreversibly destroy student/patient data. Production data lands via the
        # Render -> Cloud SQL restore (Phase 3), not via this Job; the Job only applies
        # pending migrations on top of an already-provisioned schema.
        # Staging and dev each have their OWN Job (lingolinq-migrate-staging /
        # lingolinq-migrate-dev) but both point at the SAME nonprod database, which is why the
        # nonprod concurrency group serializes them.
        # Direct VPC egress is attached for parity with the web/worker deploys: Cloud SQL
        # is reached via the built-in socket proxy (--set-cloudsql-instances, unaffected by
        # private-ranges-only), and the VPC path means a migration that ever enqueues a
        # Resque job or touches Redis can still reach Memorystore's private IP instead of
        # hanging against an unreachable address. `private-ranges-only` routes ONLY RFC1918 /
        # Google ranges through the VPC; public egress (S3/SES/etc.) still uses the default
        # path, so this does not force all traffic through the VPC. (Phase 3.)
        # --max-retries 0 is MANDATORY, not tuning. The Job default is 3 retries at a 600s task
        # timeout. 13 migrations use `disable_ddl_transaction!`, including
        # 20260702120000_add_retention_cleanup_indexes.rb, which builds indexes with
        # `algorithm: :concurrently` on log_session_boards / progresses / board_button_sounds.
        # A CREATE INDEX CONCURRENTLY killed at the timeout leaves an INVALID index behind; the
        # automatic retry then dies on PG::DuplicateTable, and the migration never records in
        # schema_migrations -- a partially advanced schema needing manual DBA repair.
        # Retrying a Rails migration is never correct. Fail once, loudly, and stop.
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$RUNTIME_SA" \
            --execution-environment gen2 \
            --set-cloudsql-instances "$GCP_CLOUDSQL_INSTANCE" \
            --network "$GCP_VPC_NETWORK" \
            --subnet "$GCP_VPC_SUBNET" \
            --vpc-egress private-ranges-only \
            --command bundle \
            --args "exec,rake,db:migrate" \
            --max-retries 0 \
            --task-timeout 3600s \
            --set-env-vars "RACK_ENV=production,RAILS_ENV=production,REDIS_TLS_VERIFY_HOSTNAME=false" \
            --set-secrets "$BOOT_SECRETS"
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region "$GCP_REGION" \
            --wait

      # Record the revision that is actually SERVING, before anything changes it. Do not derive
      # the rollback target later from "second newest revision": revision lists are ordered by
      # creation, include revisions that never took traffic, and a previous failed deploy would
      # otherwise become the recommended rollback target during an incident.
      # FIRST DEPLOY of a service (a fresh nonprod environment): `describe` fails because the
      # service does not exist yet. That is not an error here; record it as FIRST_DEPLOY so the
      # deploy step below can create the service (a brand-new service has no prior revision to
      # protect, so `--no-traffic` is moot and is omitted on creation only).
      - name: Record current serving revision
        id: record
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          FIRST_DEPLOY=false
          PREV=""
          # Only a genuine NOT_FOUND may become FIRST_DEPLOY. Any other describe failure (API 5xx,
          # rate limit, expired token, IAM blip) must fail the run here: treating it as a first
          # deploy would drop --no-traffic on an EXISTING service and, if latestRevision were
          # ever restored by a manual --to-latest, move live traffic to an unprobed revision.
          DESCRIBE_ERR="$RUNNER_TEMP/describe.err"
          if SVC_JSON="$(gcloud run services describe "$WEB_SERVICE" \
                --region "$GCP_REGION" --format=json 2>"$DESCRIBE_ERR")"; then
            PREV="$(printf '%s' "$SVC_JSON" \
              | jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName][0] // empty')"
            if [ -z "$PREV" ]; then
              echo "::warning::Could not determine a single 100% traffic revision; rollback hints will be omitted."
            fi
          elif grep -qiE 'NOT_FOUND|Cannot find service|could not be found|does not exist' "$DESCRIBE_ERR"; then
            FIRST_DEPLOY=true
            echo "::notice::Service $WEB_SERVICE does not exist yet in $GCP_PROJECT_ID/$GCP_REGION; this is its first deploy."
          else
            echo "::error::gcloud run services describe $WEB_SERVICE failed for a reason other than NOT_FOUND. Not treating this as a first deploy."
            cat "$DESCRIBE_ERR" >&2
            exit 1
          fi
          echo "PREV_REVISION=$PREV" >> "$GITHUB_ENV"
          # Emitted BOTH ways on purpose. $GITHUB_ENV feeds the shell bodies below; the step
          # OUTPUT feeds the `if:` on the first-deploy stop. GitHub documents `env` as available
          # to a step `if`, but NOT that a value written to $GITHUB_ENV by an earlier step is
          # visible there, so gating on `env.FIRST_DEPLOY` rested on undocumented behaviour. If it
          # ever evaluated false the stop would be skipped and a private first-deploy service
          # would be probed publicly and fail confusingly. Step outputs are specified for this.
          echo "FIRST_DEPLOY=$FIRST_DEPLOY" >> "$GITHUB_ENV"
          echo "first_deploy=$FIRST_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Currently serving: ${PREV:-<none>}"

      # --no-traffic --tag candidate: the new revision is created and reachable at its own
      # candidate URL, but users stay on the current revision until the health gate passes.
      # This is what makes the probe a real pre-traffic gate rather than a post-mortem.
      # On a FIRST deploy there is no current revision, so `--no-traffic` is omitted (the
      # revision takes the service's only traffic slot) but the candidate tag is still applied.
      # The probe does NOT run on a first deploy: the service is private until an operator tags
      # it and grants allUsers, so the run stops right after the deploy (next step).
      - name: Deploy web service (no traffic)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TRAFFIC_FLAG="--no-traffic"
          AUTH_FLAG="--allow-unauthenticated"
          if [ "${FIRST_DEPLOY:-false}" = "true" ]; then
            TRAFFIC_FLAG=""
            # A brand-new service is created PRIVATE. Under the org's Domain Restricted Sharing
            # policy, allUsers may only be granted to a service that already carries the
            # Resource Manager tag allUsersIngress=true, and a service cannot be tagged before it
            # exists. `--allow-unauthenticated` here would create the service, fail the IAM grant
            # with a warning, and leave a half-configured public path for the probe to 403 on.
            # The operator tags + grants once (see the first-deploy stop below), then re-runs.
            AUTH_FLAG="--no-allow-unauthenticated"
            echo "First deploy of $WEB_SERVICE: creating the service PRIVATE and without --no-traffic."
          fi
          # shellcheck disable=SC2086  # TRAFFIC_FLAG is intentionally unquoted: empty or one flag.
          gcloud run deploy "$WEB_SERVICE" \
            $TRAFFIC_FLAG \
            --tag candidate \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$RUNTIME_SA" \
            --execution-environment gen2 \
            --min-instances 1 \
            --memory 2Gi \
            --port 8080 \
            --set-cloudsql-instances "$GCP_CLOUDSQL_INSTANCE" \
            --network "$GCP_VPC_NETWORK" \
            --subnet "$GCP_VPC_SUBNET" \
            --vpc-egress private-ranges-only \
            --set-env-vars "RACK_ENV=production,RAILS_ENV=production,REDIS_TLS_VERIFY_HOSTNAME=false,$APP_ENV_VARS" \
            --set-secrets "$BOOT_SECRETS,$NON_BOOT_SECRETS" \
            "$AUTH_FLAG"

      # COUPLING WITH THE PLANNED INGRESS LOCKDOWN -- READ BEFORE RUNNING phase5-frontend-lb.sh.
      # This probe runs from a GitHub-hosted runner on the public internet and reaches the
      # revision through its candidate---* tag URL. Cloud Run ingress restrictions apply to tag
      # URLs as well as the main service URL. The moment `scripts/gcp/phase5-frontend-lb.sh`
      # sets `--ingress=internal-and-cloud-load-balancing`, this probe starts failing on every
      # attempt, and because the gate is fail-closed the outcome is: migration applied, traffic
      # pinned to the OLD revision, worker pool never updated, deploy red. Every deploy, until
      # someone notices. Before that lockdown lands, this probe must move behind the LB (a
      # tag-targeted serverless NEG) or run from inside the VPC. Do not flip ingress and this
      # workflow in the same change without deciding which one moves first.
      #
      # Probe the CANDIDATE revision by its own tagged URL, before it takes any user traffic.
      # Probing the main service URL would be worthless here and actively dangerous: it would
      # answer from the CURRENT revision and pass regardless of whether the new one works.
      #
      # What this proves and what it does not: /api/v1/health runs a `SELECT 1` and a Redis
      # PING. It proves the new image boots, reaches Cloud SQL through the socket, reaches
      # Memorystore over TLS, and can answer an HTTP request against the migrated schema. It
      # does NOT prove schema-code compatibility in general, because Rails loads column
      # metadata lazily per model, so a migration that breaks one model can still pass. The
      # expand-contract rule in the header is the control for that; this is a boot smoke test.
      #
      # Two consecutive 200s, not one: a single 200 can come from an instance that is about to
      # crash-loop on a later request.
      # FIRST-DEPLOY STOP. Fail closed, deliberately: the service now exists, private, with the
      # candidate tag on its only revision. Nothing is public and nothing was probed. The
      # operator probes the private revision with an authenticated request FIRST, then performs
      # the one-time public-ingress setup and re-runs the workflow, which then takes the normal
      # existing-service path. Order matters: the first revision owns 100% of traffic, so opening
      # ingress before that authenticated probe would expose an unverified revision. Pre-created services (lingolinq-web-staging,
      # lingolinq-web-dev, created and tagged 2026-09-02) never reach this step.
      - name: First deploy stop (operator must tag + grant public ingress, then re-run)
        if: steps.guard.outputs.enabled == 'true' && steps.record.outputs.first_deploy == 'true'
        run: |
          set -euo pipefail
          # The initial revision owns 100% of this new service's traffic (there was nothing else
          # to hold it). Granting allUsers before it is probed would expose an unverified revision,
          # so the operator sequence probes it PRIVATELY first, with their own identity token,
          # and only then opens public ingress. (Codex review of #919, round 4.)
          CAND_URL="$(gcloud run services describe "$WEB_SERVICE" --region "$GCP_REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.tag == "candidate")][0].url // empty')"
          echo "::error::$WEB_SERVICE was just CREATED in $GCP_PROJECT_ID/$GCP_REGION and is PRIVATE. Its only revision holds 100% of traffic and has NOT been probed."
          echo "::error::One-time operator sequence, in this order, then re-run this workflow:"
          echo "::error::  1. Probe the private revision with your own identity (needs run.invoker; project owners have it)."
          echo "::error::     This block FAILS CLOSED: it prints PROBE OK only if both probes return HTTP 200; otherwise it prints STOP and you must not continue."
          PROBE_URL="${CAND_URL:-<candidate tag URL: gcloud run services describe $WEB_SERVICE --region $GCP_REGION --format=json | jq .status.traffic>}"
          # Single-quoted template: nothing inside expands here; the operator's shell expands it.
          PROBE_BLOCK='( for i in 1 2; do code="$(curl -sS -o /dev/null -w '"'"'%{http_code}'"'"' -H "Authorization: Bearer $(gcloud auth print-identity-token --audiences=__AUD__)" "__URL__/api/v1/health")"; [ "$code" = "200" ] || { echo "STOP: private health probe returned HTTP $code; do NOT open ingress" >&2; exit 1; }; done; echo "PROBE OK: both probes returned 200" )'
          PROBE_AUD="$(gcloud run services describe "$WEB_SERVICE" --region "$GCP_REGION" --format='value(status.url)' 2>/dev/null || echo "$PROBE_URL")"
          PROBE_RENDERED="${PROBE_BLOCK//__URL__/$PROBE_URL}"
          echo "::error::       ${PROBE_RENDERED//__AUD__/$PROBE_AUD}"
          echo "::error::     Continue to step 2 ONLY after PROBE OK. On STOP: fix, re-run this workflow, do not open ingress."
          echo "::error::  2. gcloud resource-manager tags bindings create --location=$GCP_REGION --tag-value=<allUsersIngress=true tagValue id> --parent=//run.googleapis.com/projects/$GCP_PROJECT_ID/locations/$GCP_REGION/services/$WEB_SERVICE"
          echo "::error::  3. gcloud run services add-iam-policy-binding $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --member allUsers --role roles/run.invoker"
          echo "::error::  4. gcloud run services update-traffic $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --remove-tags candidate"
          echo "::error::  5. Re-run the workflow; it now takes the existing-service path (no-traffic candidate, public probe, pin by name)."
          echo "::error::No traffic decision was made by this run."
          exit 1

      - name: Verify candidate revision health
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          CAND_JSON="$(gcloud run services describe "$WEB_SERVICE" \
            --region "$GCP_REGION" --format=json \
            | jq -c '[.status.traffic[] | select(.tag == "candidate")][0] // empty')"
          TAG_URL="$(printf '%s' "$CAND_JSON" | jq -r '.url // empty')"
          CANDIDATE_REV="$(printf '%s' "$CAND_JSON" | jq -r '.revisionName // empty')"
          if [ -z "$TAG_URL" ] || [ -z "$CANDIDATE_REV" ]; then
            echo "::error::No candidate-tagged revision on $WEB_SERVICE. The --tag candidate deploy did not take."
            exit 1
          fi
          # Pin the IMMUTABLE revision name now. The traffic shift must target this exact
          # revision, not "whatever is latest at shift time": a concurrent manual
          # `gcloud run deploy` between this probe and the shift would otherwise put 100% of
          # traffic on a revision nobody probed. GitHub concurrency does not serialize humans
          # running gcloud.
          echo "CANDIDATE_REV=$CANDIDATE_REV" >> "$GITHUB_ENV"
          echo "Candidate revision: $CANDIDATE_REV"
          echo "Probing candidate at $TAG_URL/api/v1/health"
          OK=0
          for i in $(seq 1 12); do
            if ! CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TAG_URL/api/v1/health")"; then
              CODE=000
            fi
            case "$CODE" in
              200) OK=$((OK + 1)); echo "  attempt $i: HTTP 200 (consecutive: $OK)" ;;
              *)   OK=0;          echo "  attempt $i: HTTP $CODE" ;;
            esac
            if [ "$OK" -ge 2 ]; then
              echo "Candidate healthy on two consecutive probes."
              exit 0
            fi
            sleep 15
          done
          # Strip the public tag off the FAILING revision before giving up. Without this it stays
          # reachable at a stable unauthenticated candidate---* URL indefinitely.
          gcloud run services update-traffic "$WEB_SERVICE" \
            --region "$GCP_REGION" --remove-tags candidate || \
            echo "::warning::Failed to remove the candidate tag; do it by hand."
          echo "::error::Candidate revision $CANDIDATE_REV never returned two consecutive 200s from /api/v1/health."
          echo "::error::"
          echo "::error::STATE OF ${ENV_NAME^^} ($WEB_SERVICE in $GCP_PROJECT_ID) RIGHT NOW, read this before touching anything:"
          if [ "${FIRST_DEPLOY:-false}" = "true" ]; then
            echo "::error::  * This was the FIRST deploy of $WEB_SERVICE, so there is no previous revision:"
            echo "::error::    the failing revision IS the only one and holds the service's traffic slot."
            echo "::error::    There are no users on a first deploy; fix and roll forward."
          else
            echo "::error::  * No user traffic was shifted. Users are on ${PREV_REVISION:-the previous revision}."
          fi
          echo "::error::  * The worker pool was NOT replaced (if this environment deploys one)."
          echo "::error::  * Traffic is now PINNED to that revision by name. \`latestRevision\` is CLEARED,"
          echo "::error::    because --no-traffic converts the allocation to a named target. A manual"
          echo "::error::    \`gcloud run deploy\` will therefore create a revision serving 0% and report"
          echo "::error::    success. Shift traffic explicitly after any manual deploy."
          echo "::error::  * The database migration for this release HAS already been applied. If it is"
          echo "::error::    not backward compatible, the revision users are on may now be broken too."
          echo "::error::"
          echo "::error::DO NOT RUN \`--to-latest\`. The latest READY revision right now is"
          echo "::error::$CANDIDATE_REV, the one that just failed this gate. Ready is not healthy: this"
          echo "::error::probe exists to catch revisions that start but do not work. --to-latest would put"
          echo "::error::100% of live traffic on it."
          echo "::error::"
          if [ -n "${PREV_REVISION:-}" ]; then
            echo "::error::To re-assert the known-good revision explicitly:"
            echo "::error::  gcloud run services update-traffic $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --to-revisions $PREV_REVISION=100"
          else
            # No single 100% predecessor was recorded (split traffic, first deploy, or the
            # describe failed). Do NOT print a placeholder command: `<prev>` is shell
            # redirection, not a visible blank, so a copy-paste yields "bash: prev: No such
            # file or directory" and gcloud never runs. Send the operator to look the revision
            # up instead.
            echo "::error::No single known-good predecessor was recorded before this deploy."
            echo "::error::Find the revision to pin to, then pin it deliberately:"
            echo "::error::  gcloud run revisions list --service $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --sort-by=~metadata.creationTimestamp"
            echo "::error::  gcloud run services update-traffic $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --to-revisions <that-revision>=100"
          fi
          echo "::error::To diagnose the failed revision WITHOUT exposing it publicly:"
          echo "::error::  gcloud run revisions describe $CANDIDATE_REV --project $GCP_PROJECT_ID --region $GCP_REGION"
          echo "::error::  gcloud logging read 'resource.labels.revision_name=\"$CANDIDATE_REV\"' --project $GCP_PROJECT_ID --freshness=1h --limit=100"
          echo "::error::Do NOT re-tag it to reach it over HTTP. A tag is a stable public"
          echo "::error::unauthenticated URL onto the database, outside the load balancer"
          echo "::error::and Cloud Armor. Removing it is why this step stripped the tag above."
          echo "::error::To roll FORWARD, push a fixed commit and let this workflow verify it."
          exit 1

      # Traffic shift, gated on the probe above. Pin to the EXACT revision that was probed, by
      # immutable name. Do NOT use --to-latest here, for two reasons found in review:
      #   1. Cloud Run resolves LATEST to the newest READY revision at the moment the command
      #      runs, which is not necessarily the revision that just passed the probe. A
      #      concurrent manual deploy would send all traffic to an unprobed image.
      #   2. --to-latest silently REVERSES a human incident rollback. After someone pins to a
      #      known-good revision, a redeploy of the same bad SHA would pass this probe (it is a
      #      boot smoke test and cannot see a functional bug) and restore the bad revision.
      # Consequence to know: the service is deliberately left PINNED by name after every
      # deploy, so `latestRevision` stays cleared. That is intended. Each deploy re-pins to its
      # own verified revision. A manual `gcloud run deploy` outside this workflow will create a
      # revision that serves 0% until someone shifts traffic to it on purpose.
      # The candidate tag is removed in the same call, so no unauthenticated candidate---* URL
      # outlives the release.
      - name: Shift traffic to the verified revision
        id: shift
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_REV:-}" ]; then
            echo "::error::CANDIDATE_REV is unset; refusing to shift traffic."
            exit 1
          fi
          # WRITTEN BEFORE THE MUTATION, DELIBERATELY. `gcloud` can fail CLIENT-side (poll
          # timeout, transient 503, a dropped connection) on a shift the server already
          # ACCEPTED. Writing the marker after the call means `set -euo pipefail` kills this
          # step first, the output is never written, and the post-shift diagnostic below is
          # skipped in precisely the window it exists to cover: users on new web code, worker
          # still on the old image, nothing actionable in the log. So the marker records that
          # the shift was ATTEMPTED, which is the condition the diagnostic actually needs.
          # A false positive here costs one extra advisory block on a failed run; a false
          # negative costs the operator the pin-back command during an incident.
          # STEP OUTPUT, not $GITHUB_ENV: the diagnostic gates on this in an `if:`, and `if:`
          # is evaluated through workflow contexts. Same reasoning as first_deploy above;
          # writing it only to $GITHUB_ENV would repeat the exact pattern this commit removes.
          echo "shift_attempted=true" >> "$GITHUB_OUTPUT"
          gcloud run services update-traffic "$WEB_SERVICE" \
            --region "$GCP_REGION" \
            --to-revisions "$CANDIDATE_REV=100" \
            --remove-tags candidate
          # Past this point users are on the NEW revision. Everything from here on (worker pool,
          # scheduler Job, secret readback) can fail with traffic already shifted, which is
          # exactly when an operator needs the pin-back command. See the failure step at the
          # end of this job.
          echo "shift_confirmed=true" >> "$GITHUB_OUTPUT"
          # Read back who is serving. This read is LOAD-BEARING (it is the assert), so it is
          # guarded rather than left to `set -e`: a bare assignment failure would abort the step
          # between the completed traffic shift and the un-run worker deploy, stranding new web
          # code against old workers, and none of the diagnostics below would print. Distinguish
          # "could not read" from "read fine, wrong revision" -- they need different responses.
          SERVING=""
          DESCRIBE_OK=1
          for attempt in 1 2 3; do
            if SERVING="$(gcloud run services describe "$WEB_SERVICE" \
                 --region "$GCP_REGION" --format=json 2>/dev/null \
                 | jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName][0] // empty')"; then
              DESCRIBE_OK=0
              break
            fi
            DESCRIBE_OK=1
            sleep 5
          done
          if [ "$DESCRIBE_OK" != "0" ]; then
            echo "::error::Could not read back the traffic allocation after the shift (3 attempts)."
            echo "::error::The shift command itself SUCCEEDED, so traffic is most likely on $CANDIDATE_REV,"
            echo "::error::but that is unverified. The worker pool has NOT been replaced. Confirm with:"
            echo "::error::  gcloud run services describe $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --format='value(status.traffic)'"
            exit 1
          fi
          if [ "$SERVING" != "$CANDIDATE_REV" ]; then
            echo "::error::Traffic shift did not land where expected."
            echo "::error::  probed and intended: $CANDIDATE_REV"
            echo "::error::  actually serving:    ${SERVING:-<none, or a split with no 100% target>}"
            echo "::error::$ENV_NAME may be serving an unverified revision. Investigate before proceeding."
            exit 1
          fi
          echo "Now serving: $SERVING (was: ${PREV_REVISION:-<unknown>})"
          # Belt-and-braces only, never a gate. --remove-tags above already succeeded (set -e
          # would have killed the step otherwise), so this should not fire; it catches a human
          # racing the runner or a lagging read. Non-blocking on purpose, BUT a failed read is
          # reported as a failed read rather than silently collapsing to "no tag" -- otherwise
          # the one case this exists to report is the one case it cannot report.
          REMAINING_TAG=""
          if ! REMAINING_TAG="$(gcloud run services describe "$WEB_SERVICE" \
               --region "$GCP_REGION" --format=json 2>/dev/null \
               | jq -r '[.status.traffic[] | select(.tag == "candidate")] | length')"; then
            REMAINING_TAG=""
          fi
          if [ -z "$REMAINING_TAG" ]; then
            echo "::warning::Could not verify that the candidate tag was removed. Check by hand:"
            echo "::warning::  gcloud run services describe $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --format='value(status.traffic)'"
          elif [ "$REMAINING_TAG" != "0" ]; then
            echo "::warning::A candidate tag is still present on $WEB_SERVICE. Remove it by hand:"
            echo "::warning::  gcloud run services update-traffic $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --remove-tags candidate"
          fi

      # DEPLOY_WORKER gate (see header). Runs ONLY after the traffic shift above succeeded, so a
      # failed web rollout never leaves new workers dequeuing against old web code. Dev skips
      # this entirely: staging's worker serves the shared nonprod Redis for both.
      - name: Deploy worker pool
        if: steps.guard.outputs.enabled == 'true' && steps.guard.outputs.deploy_worker == 'true'
        run: |
          gcloud beta run worker-pools deploy "$WORKER_POOL" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$RUNTIME_SA" \
            --instances 1 \
            --memory 2Gi \
            --command bin/docker-worker-entrypoint \
            --set-cloudsql-instances "$GCP_CLOUDSQL_INSTANCE" \
            --network "$GCP_VPC_NETWORK" \
            --subnet "$GCP_VPC_SUBNET" \
            --vpc-egress private-ranges-only \
            --set-env-vars "RACK_ENV=production,RAILS_ENV=production,REDIS_TLS_VERIFY_HOSTNAME=false,$APP_ENV_VARS" \
            --set-secrets "$BOOT_SECRETS,$NON_BOOT_SECRETS"

      - name: Skip worker pool (DEPLOY_WORKER is not 'true')
        if: steps.guard.outputs.enabled == 'true' && steps.guard.outputs.deploy_worker != 'true'
        run: echo "::notice::DEPLOY_WORKER is not 'true' in environment '$ENV_NAME'; worker pool '$WORKER_POOL' and scheduler Job '$SCHEDULER_JOB' were not touched (shared-worker environment)."

      # Scheduler Job: the Cloud Scheduler-driven `rake scheduler:dispatch` (production's
      # lingolinq-scheduler was first created 2026-09-02 by cloning lingolinq-migrate; the Render
      # cron it replaces had no GCP equivalent between the 2026-07-22 cutover and that date). It
      # runs application code (log summaries, remote log push, goal advancement, the daily
      # retention purges) and enqueues Resque jobs, so it is a THIRD expand-contract surface next
      # to web and worker and is deployed AFTER the worker pool, gated on the same DEPLOY_WORKER
      # var. This workflow OWNS the Job's config: `gcloud run jobs deploy` creates or updates it
      # with the same runtime SA, Cloud SQL + VPC wiring, plain env, and FULL secret set
      # (boot + non-boot) as the web service, so a scheduler task that touches S3 or SES has the
      # credentials it needs and a hand-edited Job cannot drift for long. The Cloud Scheduler
      # TRIGGER (`0 * * * *` -> jobs/<name>:run, OAuth as scheduler-invoker@<project>) is the one
      # piece still created by an operator; without it the Job exists but never fires.
      # --task-timeout 3000s (50 min) keeps one dispatch inside its hourly slot.
      - name: Deploy scheduler Job (create or update)
        if: steps.guard.outputs.enabled == 'true' && steps.guard.outputs.deploy_worker == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$SCHEDULER_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$RUNTIME_SA" \
            --execution-environment gen2 \
            --set-cloudsql-instances "$GCP_CLOUDSQL_INSTANCE" \
            --network "$GCP_VPC_NETWORK" \
            --subnet "$GCP_VPC_SUBNET" \
            --vpc-egress private-ranges-only \
            --command bundle \
            --args exec,rake,scheduler:dispatch \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 3000s \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars "RACK_ENV=production,RAILS_ENV=production,REDIS_TLS_VERIFY_HOSTNAME=false,$APP_ENV_VARS" \
            --set-secrets "$BOOT_SECRETS,$NON_BOOT_SECRETS"
          # Read back what landed on the Job (assert-runtime-secrets.sh covers services and worker
          # pools only): every required secret must be present AND backed by a secretKeyRef.
          missing=""
          landed="$(gcloud run jobs describe "$SCHEDULER_JOB" --region "$GCP_REGION" --format=json \
            | jq -r '.spec.template.spec.template.spec.containers[0].env[] | select(.valueFrom.secretKeyRef != null) | .name')"
          for pair in $(printf '%s,%s' "$BOOT_SECRETS" "$NON_BOOT_SECRETS" | tr ',' ' '); do
            name="${pair%%=*}"
            printf '%s\n' "$landed" | grep -qx "$name" || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Scheduler Job $SCHEDULER_JOB is missing secret-backed env:$missing"
            exit 1
          fi
          # Same BAA-account literal the web/worker readback asserts via --required-literal: the
          # scheduler runs application code that can reach AiClient.
          acct="$(gcloud run jobs describe "$SCHEDULER_JOB" --region "$GCP_REGION" --format=json \
            | jq -r '.spec.template.spec.template.spec.containers[0].env[] | select(.name == "BEDROCK_EXPECTED_AWS_ACCOUNT") | .value // empty')"
          if [ "$acct" != "239044785114" ]; then
            echo "::error::Scheduler Job $SCHEDULER_JOB has BEDROCK_EXPECTED_AWS_ACCOUNT='${acct:-<unset>}', expected 239044785114."
            exit 1
          fi
          echo "Scheduler Job $SCHEDULER_JOB runs $IMAGE with $(printf '%s\n' "$landed" | grep -c .) secret-backed env vars."

      # Read back what actually landed. The "Assert referenced secrets exist + assemble runtime
      # env" step above proves the
      # secrets EXIST in Secret Manager before deploying; it cannot prove the deployed revision
      # still REFERENCES them. Revision lingolinq-web-00014 (2026-08-04) dropped exactly
      # BEDROCK_AWS_KEY and BEDROCK_AWS_SECRET while every secret container stayed healthy, and
      # the Tier 1 runtime AI path failed closed for ~54 minutes with nothing reporting it.
      # This asserts the linkage on every revision actually serving traffic (all nonzero
      # percent targets under a canary/rollback split), so a deploy that loses a secret
      # fails the run instead of shipping a silently degraded revision.
      # NOTE: this guards CI deploys only. A human running `gcloud run deploy` bypasses this
      # workflow entirely, which is how 00014 happened; see the script header.
      # --required-literal covers the same class of loss for a NON-secret control var.
      # BEDROCK_EXPECTED_AWS_ACCOUNT drives AiClient's BAA account assertion, and when it
      # is absent that assertion is SKIPPED, so losing it silently disables a HIPAA control
      # (finding LL-1b0d78dbe6). It cannot ride in --required, which fails anything not
      # backed by a secretKeyRef.
      #
      # The pattern pins the ACCOUNT ID, not merely the 12-digit shape. A shape check would
      # let a hand-run deploy set BEDROCK_EXPECTED_AWS_ACCOUNT to some other real account
      # alongside a credential from it: the app would then verify the credential against the
      # WRONG account and pass, and this readback would pass too -- the same
      # lints-a-constant-against-itself defect, relocated. The account is already a plaintext
      # literal in APP_ENV_VARS_STATIC above, so naming it here costs nothing. On an account
      # migration, both lines change together, which is the intended coupling.
      # The worker pool is included ONLY when this environment deployed one (DEPLOY_WORKER);
      # scripts/gcp/assert-runtime-secrets.sh accepts --service alone.
      - name: Assert deployed secrets landed
        if: steps.guard.outputs.enabled == 'true'
        env:
          DEPLOY_WORKER_EFFECTIVE: ${{ steps.guard.outputs.deploy_worker }}
        run: |
          set -euo pipefail
          worker_args=()
          if [ "$DEPLOY_WORKER_EFFECTIVE" = "true" ]; then
            worker_args=(--worker-pool "$WORKER_POOL")
          fi
          # BEDROCK_EXPECTED_AWS_ACCOUNT is pinned in every environment. The FIVE values below
          # left this file for GitHub environment variables, where the only gate is non-blank:
          # a wrong-but-well-formed bucket, CDN origin or Sentry label would pass every check and
          # nobody reviewing a PR can see them. Assert PRODUCTION's here, so the readback that
          # already runs proves what actually landed on the revision. Not circular: these
          # assertions live in the repo and are reviewed; the variables are not.
          # Four are pinned to an exact ERE. REMOTE_EXTRA_DATA is asserted present-and-non-empty
          # instead, because that is precisely what the app tests -- pinning a value there would
          # be stricter than the runtime and would fail a working deploy. Match the assertion to
          # the semantics of the consumer, not to the tidiest-looking regex.
          #
          # COUNT THIS LIST AGAINST THE HEADER AT THE TOP OF THIS FILE. It names five moved
          # values: two buckets, the CDN, the Sentry env, and REMOTE_EXTRA_DATA. A previous
          # revision of this block pinned four and omitted REMOTE_EXTRA_DATA -- the one with a
          # production incident behind it (its absence zeroed 1754 of 2061 button sets in
          # PR #724). The "Assert referenced secrets exist + assemble runtime env" step proves
          # the VARIABLE is non-blank;
          # only this readback proves the env var LANDED on the revision. Adding a sixth moved
          # value without a line here reopens exactly that gap.
          #
          # Cite STEP NAMES here, never line numbers. The previous version of this comment
          # pointed at :644 and :649, and the very commit that wrote it shifted those lines to
          # `done` and `fi`. A locator that rots is worse than no locator.
          literal_args=(--required-literal 'BEDROCK_EXPECTED_AWS_ACCOUNT=^239044785114$')
          if [ "$ENV_NAME" = "production" ]; then
            literal_args+=(--required-literal 'UPLOADS_S3_BUCKET=^lingolinq-prod-uploads$')
            literal_args+=(--required-literal 'STATIC_S3_BUCKET=^lingolinq-prod-static$')
            literal_args+=(--required-literal 'UPLOADS_S3_CDN=^https://d34sa6lc5jfe66\.cloudfront\.net$')
            literal_args+=(--required-literal 'SENTRY_ENVIRONMENT=^production$')
            # PRESENCE, not a value pin, because that is exactly what the app does:
            # app/models/concerns/extra_data.rb reads `!!ENV['REMOTE_EXTRA_DATA']`, and EVERY
            # non-empty string is truthy in Ruby -- "0" and "false" included. A `^1$` pin was
            # therefore STRICTER THAN THE RUNTIME: a working `true` would pass the non-blank
            # pre-deploy gate, run correctly, and then fail here in the LAST step, after
            # traffic had already shifted. That converts benign config drift into a red
            # production deploy with users on the new revision. The bare-name form asserts
            # present-and-non-empty, which is the exact condition PR #724 lost.
            literal_args+=(--required-literal 'REMOTE_EXTRA_DATA')
          fi
          bash scripts/gcp/assert-runtime-secrets.sh \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service "$WEB_SERVICE" \
            "${worker_args[@]}" \
            --required "$BOOT_SECRETS,$NON_BOOT_SECRETS" \
            "${literal_args[@]}"

      # POST-SHIFT FAILURE DIAGNOSTIC. The candidate-probe failure path prints a pin-back command
      # because at that point nothing had moved. Everything AFTER the traffic shift -- worker pool,
      # scheduler Job, secret readback -- can fail with users already on the new revision, and
      # before this step those failures printed nothing actionable: a red run, new web code live,
      # and possibly an old worker still draining the queue. This step fires only in that window.
      # `cancelled()` is a SEPARATE status condition: `failure()` is false for a cancelled run,
      # so gating on failure() alone loses the operator exactly when someone hits cancel during
      # a deploy. Gate on the attempt marker, not on confirmed success -- see the comment at the
      # shift step for why an ambiguous client-side failure is the case that matters most.
      - name: On failure after the traffic shift, print the rollback
        if: (failure() || cancelled()) && steps.shift.outputs.shift_attempted == 'true'
        run: |
          # "cancelled" is not "failed": a run can be cancelled after a perfectly successful
          # shift, with no step having failed at all. Saying "A step FAILED" there sends the
          # operator hunting for a failure that does not exist.
          if [ "${{ job.status }}" = "cancelled" ]; then
            WHY="was CANCELLED"
          else
            WHY="had a step FAIL"
          fi
          if [ "${{ steps.shift.outputs.shift_confirmed }}" = "true" ]; then
            echo "::error::This run $WHY AFTER traffic was shifted. $WEB_SERVICE in $GCP_PROJECT_ID is serving ${CANDIDATE_REV:-the new revision} NOW."
          else
            echo "::error::This run $WHY. The traffic shift was ATTEMPTED but did not confirm. $WEB_SERVICE in $GCP_PROJECT_ID may be serving ${CANDIDATE_REV:-the new revision}, or may still be on ${PREV_REVISION:-the previous revision}. VERIFY BEFORE ACTING:"
            echo "::error::  gcloud run services describe $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --format='value(status.traffic)'"
          fi
          echo "::error::The worker pool and/or scheduler Job may still be on the PREVIOUS image, so web and worker can be running different code."
          if [ -n "${PREV_REVISION:-}" ]; then
            echo "::error::To put users back on the last known-good revision:"
            echo "::error::  gcloud run services update-traffic $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --to-revisions $PREV_REVISION=100"
          else
            echo "::error::No single known-good predecessor was recorded. Find one, then pin it deliberately:"
            echo "::error::  gcloud run revisions list --service $WEB_SERVICE --project $GCP_PROJECT_ID --region $GCP_REGION --sort-by=~metadata.creationTimestamp"
          fi
          echo "::error::Then re-run this workflow on the commit you intend to ship. Do not leave web and worker split."
