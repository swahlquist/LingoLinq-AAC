name: CI

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lingolinq_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/
      SECURE_ENCRYPTION_KEY: ${{ secrets.SECURE_ENCRYPTION_KEY }}
      SECURE_NONCE_KEY: ${{ secrets.SECURE_NONCE_KEY }}
      COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
      DEFAULT_EMAIL_FROM: ${{ secrets.DEFAULT_EMAIL_FROM }}
      SYSTEM_ERROR_EMAIL: ${{ secrets.SYSTEM_ERROR_EMAIL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup assets (vendor.css, frontend.css symlinks)
        run: bundle exec rails extras:assert_js

      - name: Setup database
        run: |
          bundle exec rails db:create db:schema:load

      # Parse-check the guard BEFORE trusting its verdict. The guard had no `set -e`,
      # so a single broken line (a comment banner that lost its '#') printed to stderr,
      # ran on to the OK block, and exited 0 -- observed live during review. The guard
      # now traps ERR and fails closed, and this step is the belt to that braces: a
      # syntax error is caught before the control is asked for an answer at all.
      - name: Parse-check the AI endpoint guard and its test harness
        run: bash -n scripts/ai-endpoint-guard.sh && bash -n scripts/tests/ai-endpoint-guard-test.sh

      - name: AI endpoint guard (runtime AI must route via AWS Bedrock, not api.anthropic.com)
        run: bash scripts/ai-endpoint-guard.sh

      # The guard above scans a scope DISCOVERED from the whole repo (minus stated
      # exclusions) rather than a hardcoded seam list, so a newly added runtime AI file
      # cannot pass simply by not being listed (finding LL-1189af1b3c). A discovered scope is only worth
      # what its discovery is worth, so the guard is tested rather than trusted:
      # fixtures assert every rule fires, and that reviewer-only scripts, specs and
      # prose comments do not false-positive. Bash-only, offline, no credentials.
      - name: Verify the AI endpoint guard actually fires
        run: scripts/tests/ai-endpoint-guard-test.sh

      - name: Run RSpec
        run: bundle exec rspec

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # The cache key MUST carry the Node major. node_modules holds native
      # bindings (sqlite3) compiled against a specific Node ABI; restoring a
      # Node-20-built tree into a Node 22 runner loads a binding built for the
      # wrong ABI. Bump this suffix on every Node major bump.
      - name: Cache node_modules and Puppeteer Chrome
        uses: actions/cache@v5
        with:
          path: |
            app/frontend/node_modules
            ~/.cache/puppeteer
          key: ${{ runner.os }}-node22-${{ hashFiles('app/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      # Template lint gate: fails on any NEW ember-template-lint violation (incl.
      # no-implicit-this bare-property refs that crash render in Ember 5.x).
      # Pre-existing violations are grandfathered in .lint-todo (suppressed until
      # their per-entry error date); this only blocks newly-introduced ones.
      - name: Lint Ember templates
        working-directory: app/frontend
        run: npm run lint:hbs

      # JS lint gate: fails on any NEW ESLint finding (error or warning).
      # Pre-existing findings are grandfathered in app/frontend/.eslint-todo;
      # this only blocks newly-introduced ones. Not the same as disabling rules.
      - name: Lint Ember JS
        working-directory: app/frontend
        run: npm run lint:js:ci

      # Puppeteer downloads Chrome under ~/.cache/puppeteer, not inside node_modules.
      # Restoring only node_modules leaves executablePath() pointing at a missing binary.
      - name: Ensure Puppeteer Chrome is present
        working-directory: app/frontend
        run: npx puppeteer browsers install chrome

      - name: Build Ember app
        working-directory: app/frontend
        run: npx ember build

      - name: Run Ember tests (Chrome Headless)
        working-directory: app/frontend
        # A healthy full run finishes in ~34 min. Cap the step so a wedged
        # runner (e.g. testem's iframe channel corrupted by a post-teardown
        # stack overflow) fails fast instead of burning the 6h Actions ceiling.
        timeout-minutes: 50
        run: npx ember test

  # Blocking gate for the audit/compliance system's own generated artifacts. These
  # are deterministic, stdlib-only render checks (no gems, no network) that fail ONLY
  # if a generated markdown drifts from its JSON source of truth - so making them
  # blocking is low-friction and keeps the register's human-readable mirrors honest.
  # (citation-check.rb is intentionally NOT gated here: a repo-wide blocking citation
  # check is a broader policy decision.)
  #
  # ONE EXCEPTION to "no git history": legal-naming-check.rb reads the register at the
  # base revision, because its grandfather allowlist cannot be allowed to certify
  # itself. That is why a base-branch fetch step appears below.
  audit-artifacts-integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Verify compliance calendar render matches JSON
        run: ruby scripts/compliance-calendar-render.rb --check

      - name: Verify Notion compliance page matches register
        run: ruby scripts/compliance-notion-publish.rb --check

      - name: Verify document register render + git content hashes + bundle completeness
        run: ruby scripts/document-register-render.rb --check

      - name: Verify attestedContentHash guards (drift + closed exemption set)
        run: scripts/tests/attestation-hash-guard-test.sh

      - name: Verify compliance publication status report
        run: ruby scripts/compliance-publication-status.rb --check

      - name: Verify capability ledger (currentEvidence resolves at HEAD; negativeEvidence scoping)
        run: ruby scripts/capability-check.rb --check

      # legal-naming-check verifies meta.legalNamingGrandfathered against the BASE revision,
      # so unlike the render checks above it does need a little git history.
      #
      # The baseline is the EVENT'S EXACT SHA, not a branch name, and that distinction is a
      # fix. Resolving `origin/<branch>` meant a push run compared the branch against
      # itself: self-comparing, trivially satisfied, and bypassable by pushing directly to
      # a protected branch. Pull requests use the base commit the PR actually forked from;
      # pushes use the pre-push SHA, so the comparison spans what the push introduced.
      #
      # Fails closed if neither is available, because "I could not verify the allowlist" is
      # not the same claim as "the allowlist is fine". Push triggers here are limited to
      # main/develop/staging, which always have a real predecessor, so the all-zeros
      # new-branch case cannot arise on this workflow.
      - name: Resolve and fetch the naming allowlist baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No usable base SHA for the docs/legal naming allowlist baseline." >&2
            echo "Refusing rather than skipping: an unverifiable allowlist is exactly what an" >&2
            echo "allowlist-laundering change would produce." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "NAMING_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Verify docs/legal naming rule (attested rows carry no status token)
        run: ruby scripts/legal-naming-check.rb --base-ref "$NAMING_BASE_SHA" --check

      # The rule above is unfixable once violated, because attestation freezes the
      # filename permanently. So the guard itself is tested here rather than trusted:
      # a check only ever seen passing on clean data proves the data is clean, not that
      # the check works.
      - name: Verify the docs/legal naming guards actually fire
        run: scripts/tests/legal-naming-check-test.sh

      # Structural gate on the registers themselves. The render checks above only compare a
      # generated markdown to its JSON source; none of them reads the field SHAPES the register's
      # consumers depend on, so a malformed row (observed: `source` written as a bare String
      # instead of an object) merged green here and then hard-crashed promote-finding.rb for the
      # entire register weeks later. This validates shapes, enum membership, and id uniqueness.
      # Stdlib-only and git-free, like the checks above, so it is equally low-friction to gate on.
      - name: Verify findings registers are structurally valid
        run: ruby scripts/register-lint.rb audit-reports/FINDINGS.json audit-reports/ember-upgrade/FINDINGS-EMBER.json

      # Proves the evidence.sha branch of register-lint actually FIRES. register-lint is the
      # only structural gate on findings rows that runs here (citation-check.rb is deliberately
      # not a CI job, see the comment on this workflow above), so if its sha rules silently stop
      # firing, nothing else catches a findings row whose evidence is unanchored or ambiguously
      # anchored. Fixtures are built in a temp dir; audit-reports/ is never touched.
      - name: Verify the register evidence.sha guards actually fire
        run: scripts/tests/register-lint-sha-test.sh

      # Proves the field-shape, enum, and duplicate-id branches of register-lint
      # actually FIRE. The sha harness above covers evidence.sha; this covers the
      # rest of the structural contract. A rule that has only ever been observed
      # passing on the committed registers is evidence that those registers are
      # clean, not that the rule works. Fixtures are built in a temp dir;
      # audit-reports/ is never touched.
      - name: Verify the register shape/enum/duplicate-id guards actually fire
        run: scripts/tests/register-lint-shape-test.sh

      # Belt and braces to the lint above: register-lint checks the shapes we PREDICTED the
      # consumers need; this runs the real consumers (promote-finding.rb, audit-merge.rb) over each
      # committed register with empty input and asserts they exit 0 AND leave the file
      # byte-identical. It catches whatever the predicate list failed to anticipate.
      - name: Verify registers are consumable by promote-finding / audit-merge (no-op run)
        run: scripts/tests/register-consumer-smoke-test.sh

  codex-review-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Guards the codex-review envelope logic: status fail-closed mapping,
      # the prompt-injection guard, the per-chunk convergence policy, and the
      # cross-chunk fold. Stdlib-only (unittest), so no Python setup or
      # dependencies are needed.
      - name: Run codex-review envelope guard + convergence unit tests
        run: python3 scripts/codex-review-build-envelope.test.py

      # Guards the chunked-evidence builder: deterministic diff, structural
      # index (added + removed symbols with real source lines), sub-cap chunk
      # packing, and the MAX_CHUNKS hard-stop that keeps a too-large PR
      # fail-closed.
      - name: Run codex-review evidence-builder unit tests
        run: python3 scripts/codex-review-build-evidence.test.py

      # Guards the per-chunk runner: per-chunk approve convergence, the single
      # decisive path fed to synthesis, and non-fatal heartbeat/retry handling.
      - name: Run codex-review chunk-runner unit tests
        run: python3 scripts/codex-review-run-chunks.test.py

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run Brakeman (Rails SAST)
        run: |
          gem install brakeman
          brakeman --no-pager --format json --output brakeman-results.json || true
          brakeman --no-pager --format text
        continue-on-error: true

      - name: Upload Brakeman results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: brakeman-results
          path: brakeman-results.json

      - name: Run bundle-audit (gem CVE check)
        run: |
          gem install bundler-audit
          bundle-audit check --update

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run npm audit (frontend CVE check)
        working-directory: app/frontend
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high || true
        continue-on-error: true

  # Blocking gate. Unlike the advisory Brakeman/npm steps above, a leaked secret
  # MUST fail CI. To stay safe as a required check we scan only the secrets a PR /
  # push actually INTRODUCES (the commit delta), never the full history: one
  # historical false positive must not block every future merge. Pair this with
  # the staging branch-protection required-status-checks list so it gates merge.
  secret-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download gitleaks (CLI - no license required)
        run: |
          set -o pipefail
          # PINNED DELIBERATELY -- do not restore the "fetch latest release"
          # lookup that used to sit here. This job is a REQUIRED check, and
          # resolving the newest gitleaks at run time made its rule set drift
          # with upstream: the same commits scanned clean when they landed and
          # dirty months later, with nothing in this repo having changed.
          # Three such false positives blocked PR #938 and had to be triaged
          # into .gitleaksignore. A required gate must be reproducible, so the
          # version moves only when someone bumps it here on purpose.
          #
          # Bumping: raise GITLEAKS_VERSION, let CI run, and triage anything
          # new the way .gitleaksignore documents.
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_DOWNLOAD_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors "$GITLEAKS_DOWNLOAD_URL" | tar -xz gitleaks
          ./gitleaks version

      - name: Scan for newly-introduced secrets (blocking)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          echo "Scanning commit range for secrets: $RANGE"
          # --redact keeps any matched secret value out of the public CI log.
          ./gitleaks detect --source . --log-opts="$RANGE" --redact --exit-code 1
